# Supabase pauses free-plan projects after about a week without any requests,
# which takes the whole site's content offline until someone restores it in
# the dashboard. This sends one small, read-only public request every two days
# so a quiet week never pauses it.
#
# Uses the same public repo Variables as the deploy (no secrets). Note: GitHub
# disables scheduled workflows in repositories with no commits for 60 days;
# re-enable it from the Actions tab if that happens.

name: Keep Supabase awake

on:
  schedule:
    - cron: '17 9 */2 * *' # every second day, 09:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read the public site settings
        env:
          URL: ${{ vars.VITE_SUPABASE_URL }}
          KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "::warning::Supabase variables are not set"; exit 0; fi
          status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$URL/rest/v1/site_settings?select=brand_name&limit=1" -H "apikey: $KEY")
          echo "Supabase answered $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not answer normally ($status). The project may be paused: open the Supabase dashboard and restore it."
            exit 1
          fi
